<!-- Header -->
<div class="header-section sticky-top bg-white px-3 py-3 border-bottom">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center" (click)="goBack()"
      style="width: 40px; height: 40px; background-color: #f3f4f6; border: none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="#4b5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div>
      <h5 class="m-0 text-dark font-weight-bold" style="font-size: 1.1rem;">Purchase Receipt</h5>
      <div class="text-muted" style="font-size: 0.85rem;">{{ supplier.name }}</div>
    </div>
  </div>
</div>

<!-- Scrollable Content -->
<div class="content-section p-3 d-flex flex-column gap-3" style="padding-bottom: 90px !important;">

  <!-- Supplier Card (Image 2 Design) -->
  <div class="card border-0 shadow-sm rounded-4 p-3" style="background-color: white;">
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="icon-box rounded-circle d-flex align-items-center justify-content-center"
        style="background-color: #eaf8f4; color: #0ca678; width: 48px; height: 48px; min-width: 48px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <div>
        <div class="font-weight-bold" style="font-size: 1.1rem; color: #1f2937;">{{ supplier.name }}</div>
        <div class="text-muted" style="font-size: 0.85rem;">{{ supplier.address }}</div>
      </div>
    </div>
    
    <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-light">
      <div class="d-flex align-items-center gap-2 text-muted" style="font-size: 0.85rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span>Location</span>
      </div>
      <div class="font-weight-bold" style="font-size: 0.9rem; color: #1f2937;">{{ supplier.location || supplier.address }}</div>
    </div>
    
    <div class="d-flex justify-content-between align-items-center pt-2">
      <div class="d-flex align-items-center gap-2 text-muted" style="font-size: 0.85rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span>Contact</span>
      </div>
      <div class="font-weight-bold" style="font-size: 0.9rem; color: #0ca678;">{{ supplier.phone }}</div>
    </div>
  </div>

  <form [formGroup]="receiptForm" class="d-flex flex-column gap-3">
    <!-- Weight Input Card -->
    <div class="card border-0 shadow-sm rounded-4 p-3" style="background-color: white;">
      <div class="text-muted mb-2 font-weight-bold" style="font-size: 0.8rem; letter-spacing: 0.5px;">WEIGHT</div>
      <div class="d-flex align-items-center gap-2 mb-2 text-muted" style="font-size: 0.9rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 7h.01"></path>
            <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"></path>
            <path d="m20 7 2 .5-2 .5"></path>
            <path d="M10 18v3"></path>
            <path d="M14 17.75V21"></path>
            <path d="M7 18a6 6 0 0 0 3.84-10.61"></path>
        </svg>
        <span>Total weight</span>
      </div>
      <input type="number" formControlName="totalWeight" class="form-control rounded-3 py-2" style="border: 1px solid #e5e7eb; font-size: 1rem;">
    </div>

    <!-- Quantity Input Card -->
    <div class="card border-0 shadow-sm rounded-4 p-3" style="background-color: white;">
      <div class="text-muted mb-2 font-weight-bold" style="font-size: 0.8rem; letter-spacing: 0.5px;">QUANTITY</div>
      <div class="d-flex align-items-center gap-2 mb-2 text-muted" style="font-size: 0.9rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 7h.01"></path>
            <path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"></path>
            <path d="m20 7 2 .5-2 .5"></path>
            <path d="M10 18v3"></path>
            <path d="M14 17.75V21"></path>
            <path d="M7 18a6 6 0 0 0 3.84-10.61"></path>
        </svg>
        <span>Number of Birds</span>
      </div>
      <input type="number" formControlName="numberOfBirds" class="form-control rounded-3 py-2" style="border: 1px solid #e5e7eb; font-size: 1rem;">
    </div>
  </form>

</div>

<!-- Footer Action -->
<div class="footer-section fixed-bottom bg-white border-top p-3" style="z-index: 1000;">
  <button
    class="btn btn-confirm w-100 rounded-4 py-3 font-weight-bold text-size-md d-flex align-items-center justify-content-center gap-2"
    [disabled]="!receiptForm.valid" (click)="confirmPurchase()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="8 12 11 15 16 9"></polyline>
    </svg>
    Confirm Purchase
  </button>
</div>
